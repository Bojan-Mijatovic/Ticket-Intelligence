server:
  port: 8080

spring:
  application:
    name: mediagenda
  datasource:
    url: jdbc:h2:mem:mediagenda;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration
  h2:
    console:
      enabled: true

logging:
  level:
    com.mediagenda: INFO
