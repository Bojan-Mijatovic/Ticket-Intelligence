server:
  port: 8082

spring:
  application:
    name: medifarma
  datasource:
    url: jdbc:h2:mem:medifarma;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration
  h2:
    console:
      enabled: true

# The other applications of the suite (MediAgenda: patient registry; MediLab: laboratory results).
medisuite:
  mediagenda:
    url: http://localhost:8080
    timeout-ms: 3000
  medilab:
    url: http://localhost:8081
    timeout-ms: 3000

logging:
  level:
    com.medifarma: INFO
