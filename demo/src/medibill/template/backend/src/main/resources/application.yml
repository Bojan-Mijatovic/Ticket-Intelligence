server:
  port: 8083

spring:
  application:
    name: medibill
  datasource:
    url: jdbc:h2:mem:medibill;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration
  h2:
    console:
      enabled: true

# The other applications of the suite (MediAgenda: patients and visits; MediLab: reported tests).
medisuite:
  mediagenda:
    url: http://localhost:8080
    timeout-ms: 5000
  medilab:
    url: http://localhost:8081
    timeout-ms: 5000

logging:
  level:
    com.medibill: INFO
